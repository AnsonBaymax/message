<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>服务通知模板</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --line: #f0f0f0;
      --text: #333333;
      --muted: #666666;
      --primary: #ff4d88;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .page {
      height: 100%;
      padding: 16px;
    }

    .card {
      height: 100%;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      padding: 16px 16px 10px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .btn {
      height: 28px;
      padding: 0 14px;
      border-radius: 2px;
      border: 0;
      font-size: 12px;
      line-height: 28px;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
    }

    .table-wrap {
      flex: 1;
      overflow: auto;
      background: #fff;
      padding: 0 16px 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
      font-size: 14px;
      min-width: 960px;
    }

    thead th {
      background: #fff;
      color: #444;
      text-align: left;
      font-weight: 600;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      white-space: nowrap;
    }

    thead th:last-child,
    tbody td:last-child {
      border-right: none;
    }

    tbody td {
      color: var(--muted);
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      vertical-align: top;
      word-break: break-all;
      line-height: 1.6;
    }

    tbody tr:hover {
      background: #fafafa;
    }

    .status {
      color: #333;
    }

    .op {
      color: var(--primary);
      text-decoration: none;
      margin-right: 18px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .col-name { width: 16%; min-width: 160px; }
    .col-key { width: 16%; min-width: 170px; }
    .col-keyword { width: 28%; min-width: 240px; }
    .col-user { width: 12%; min-width: 120px; }
    .col-time { width: 16%; min-width: 170px; }
    .col-status { width: 6%; min-width: 72px; }
    .col-op { width: 6%; min-width: 110px; }

    th.col-status,
    th.col-op,
    tbody td:nth-child(6),
    tbody td:nth-child(7) {
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="card">
      <div class="toolbar">
        <button class="btn btn-primary">新 增</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-name">服务通知模板</th>
              <th class="col-key">服务通知模板Key</th>
              <th class="col-keyword">关键词</th>
              <th class="col-user">最后更新人</th>
              <th class="col-time">更新时间</th>
              <th class="col-status">状态</th>
              <th class="col-op">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>提现成功提醒</td>
              <td>TIXIANCHENGGONG</td>
              <td>描述、提现时间、提现金额、收款账号、到账时间、跳转地址</td>
              <td>陈慧珍/3096</td>
              <td>2025-04-28 17:57:37</td>
              <td class="status">启用</td>
              <td><span class="op">修改</span><span class="op">禁用</span></td>
            </tr>
            <tr>
              <td>返现到账提醒</td>
              <td>FANXIANDAOZHANG</td>
              <td>描述、商家名称、返现金额、到账时间、跳转地址</td>
              <td>齐婉竹/2959</td>
              <td>2024-07-26 14:07:14</td>
              <td class="status">启用</td>
              <td><span class="op">修改</span><span class="op">禁用</span></td>
            </tr>
            <tr>
              <td>金豆过期提醒</td>
              <td>JINDOUGUOQI</td>
              <td>描述、过期金豆数、过期日期、跳转地址</td>
              <td>苏畅/956</td>
              <td>2024-12-30 18:59:19</td>
              <td class="status">启用</td>
              <td><span class="op">修改</span><span class="op">禁用</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</body>
</html>
