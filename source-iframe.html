        for (var i = 0; i < templates.length; i++) {
          var t = templates[i];
          html.push('<option value="' + t.replace(/"/g, '&quot;') + '">' + t + '</option>');
        }
      }

      templateSelect.innerHTML = html.join('');
    }

    function getMessageInput(value) {
      return messageGroup.querySelector('input[type="radio"][value="' + value + '"]');
    }

    function getCurrentMessageInput() {
      return messageGroup.querySelector('input[type="radio"]:checked');
    }

    function syncRadioClasses() {
      var labels = messageGroup.querySelectorAll('label.ant-radio-button-wrapper');
      for (var i = 0; i < labels.length; i++) {
        var label = labels[i];
        var input = label.querySelector('input[type="radio"]');
        var btn = label.querySelector('.ant-radio-button');
        var checked = !!(input && input.checked);
        label.classList.toggle('ant-radio-button-wrapper-checked', checked);
        if (btn) {
          btn.classList.toggle('ant-radio-button-checked', checked);
        }
      }
    }

    function setMessageType(value) {
      var input = getMessageInput(value);
      if (!input || input.disabled || input.closest('label').style.display === 'none') return;

      var all = messageGroup.querySelectorAll('input[type="radio"]');
      for (var i = 0; i < all.length; i++) {
        all[i].checked = false;
      }

      input.checked = true;
      syncRadioClasses();
      updateTemplateVisibility();
    }

    function updateTemplateVisibility() {
      if (!templateItem) return;
      var current = getCurrentMessageInput();
      var show = level1.value === '服务型' && current && current.value === 'REMIND';
      templateItem.style.display = show ? '' : 'none';
      if (show) {
        renderTemplateOptions();
      }
    }

    function updateMessageTypeByCategory(level1Value) {
      var remindInput = getMessageInput('REMIND');
      if (!remindInput) return;

      var remindLabel = remindInput.closest('label.ant-radio-button-wrapper');
      var shouldHideRemind = level1Value === '内容型' || level1Value === '营销型';

      if (remindLabel) {
        remindLabel.style.display = shouldHideRemind ? 'none' : '';
      }

      if (shouldHideRemind && remindInput.checked) {
        setMessageType('CONTENT');
      }

      if (level1Value === '服务型') {
        setMessageType('REMIND');
      }

      syncRadioClasses();
      updateTemplateVisibility();
    }

    messageGroup.addEventListener('click', function (e) {
      var target = e.target;
      var label = target.closest('label.ant-radio-button-wrapper');
      if (!label || !messageGroup.contains(label)) return;

      if (label.style.display === 'none') return;
      var input = label.querySelector('input[type="radio"]');
      if (!input) return;

      setMessageType(input.value);
    });

    var radios = messageGroup.querySelectorAll('input[type="radio"]');
    for (var i = 0; i < radios.length; i++) {
      radios[i].addEventListener('change', function () {
        syncRadioClasses();
        updateTemplateVisibility();
      });
    }

    level1.addEventListener('change', function (e) {
      renderLevel2Options(e.target.value);
      renderTemplateOptions();
      updateMessageTypeByCategory(e.target.value);
    });

    level2.addEventListener('change', function () {
      renderTemplateOptions();
    });

    renderLevel2Options(level1.value);
    renderTemplateOptions();
    syncRadioClasses();
    updateMessageTypeByCategory(level1.value);
    return true;
  }

  if (!initCategoryAndMessageLinkage()) {
    window.addEventListener('load', initCategoryAndMessageLinkage, { once: true });
  }
})();
</script>
