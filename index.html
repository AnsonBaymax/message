<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>消息治理页面入口</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 15% 0%, #ecfeff 0, var(--bg) 42%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .wrap {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
      padding: 24px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 8px;
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }
    a {
      display: block;
      text-decoration: none;
      color: var(--accent);
      background: #f8fafc;
      border: 1px solid var(--line);
      padding: 12px 14px;
      border-radius: 10px;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    a:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(15, 118, 110, 0.12);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>消息治理页面入口</h1>
    <p>根路径已配置。请选择需要访问的页面：</p>
    <ul>
      <li><a href="./restore-1to1.html">restore-1to1.html</a></li>
      <li><a href="./source-top.html">source-top.html</a></li>
      <li><a href="./source-iframe.html">source-iframe.html</a></li>
      <li><a href="./source-service-template.html">source-service-template.html</a></li>
    </ul>
  </main>
</body>
</html>
